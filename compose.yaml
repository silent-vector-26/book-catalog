services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: book_catalog
      POSTGRES_USER: book_catalog
      POSTGRES_PASSWORD: book_catalog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book_catalog -d book_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
